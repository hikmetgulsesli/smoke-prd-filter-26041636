<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smoke Sayaç - Başarı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed-variant": "#404754",
                      "surface-tint": "#0053db",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#ffdbcd",
                      "secondary-fixed": "#dce2f3",
                      "inverse-surface": "#2e3132",
                      "outline-variant": "#c3c6d7",
                      "on-background": "#191c1d",
                      "primary-container": "#2563eb",
                      "on-primary-fixed": "#00174b",
                      "surface-bright": "#f8f9fa",
                      "on-tertiary-container": "#ffede6",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "surface-container-high": "#e7e8e9",
                      "on-tertiary": "#ffffff",
                      "outline": "#737686",
                      "on-tertiary-fixed": "#360f00",
                      "surface-variant": "#e1e3e4",
                      "surface-container": "#edeeef",
                      "tertiary": "#943700",
                      "inverse-primary": "#b4c5ff",
                      "secondary-container": "#dce2f3",
                      "primary-fixed-dim": "#b4c5ff",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#004ac6",
                      "on-secondary-container": "#5e6572",
                      "error-container": "#ffdad6",
                      "tertiary-container": "#bc4800",
                      "secondary-fixed-dim": "#c0c7d6",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#151c27",
                      "secondary": "#585f6c",
                      "on-surface-variant": "#434655",
                      "on-primary-container": "#eeefff",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-primary": "#ffffff",
                      "surface": "#f8f9fa",
                      "surface-container-highest": "#e1e3e4",
                      "background": "#f8f9fa",
                      "on-secondary": "#ffffff",
                      "surface-container-low": "#f3f4f5",
                      "inverse-on-surface": "#f0f1f2",
                      "primary-fixed": "#dbe1ff",
                      "surface-dim": "#d9dadb",
                      "on-surface": "#191c1d",
                      "tertiary-fixed-dim": "#ffb596"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Inter"
                      ],
                      "display": [
                              "Inter"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
        }
      </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar -->
<header class="bg-slate-50 dark:bg-[#191c1d] text-[#004ac6] dark:text-[#2563eb] font-['Inter'] tracking-tight docked full-width top-0 no-border transition-colors duration-300 flat no shadows flex justify-between items-center w-full px-6 py-4 fixed z-40">
<div class="text-lg font-bold tracking-widest text-[#191c1d] dark:text-slate-50 uppercase">
            Smoke Sayaç
        </div>
<div class="flex items-center space-x-4">
<button class="hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-all p-2 rounded-full scale-95 active:duration-100">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-all p-2 rounded-full scale-95 active:duration-100">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-6 relative z-10">
<!-- Toast Notification (Absolute positioned relative to main content area for demo) -->
<div class="absolute top-28 left-1/2 transform -translate-x-1/2 z-50 flex items-center justify-center pointer-events-none">
<div class="bg-on-surface text-surface py-3 px-6 rounded-full flex items-center space-x-3 shadow-lg max-w-sm w-full mx-4 pointer-events-auto">
<span class="material-symbols-outlined text-surface-tint" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body text-sm font-medium tracking-wide">Sayaç sıfırlandı</span>
</div>
</div>
<!-- The Hero Counter area -->
<div class="flex flex-col items-center mb-16 relative">
<h2 class="text-xs uppercase tracking-[0.1em] text-on-surface-variant mb-6 font-label">BUGÜN</h2>
<div class="text-[72px] font-bold leading-none tracking-[-0.04em] text-on-surface">
                0
            </div>
</div>
<!-- Interaction Controls (Elevated Surface) -->
<div class="bg-surface-container-low w-full max-w-md rounded-2xl p-8 flex flex-col items-center space-y-8 relative">
<!-- Reset Button (Asymmetric placement as per guidelines) -->
<button aria-label="Sıfırla" class="absolute top-6 right-6 text-secondary hover:bg-surface-variant p-2 rounded-full transition-colors flex items-center justify-center group">
<span class="material-symbols-outlined text-[20px] group-hover:rotate-180 transition-transform duration-300" data-icon="restart_alt">restart_alt</span>
</button>
<div class="w-full flex justify-center items-center space-x-6 mt-8">
<!-- Decrement Button -->
<button aria-label="Azalt" class="bg-secondary-container text-on-secondary-container rounded-lg p-4 w-16 h-16 flex items-center justify-center hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-[28px]" data-icon="remove">remove</span>
</button>
<!-- Increment Button (Primary CTA) -->
<button aria-label="Artır" class="bg-gradient-to-br from-primary-container to-primary text-on-primary rounded-lg p-6 w-24 h-24 flex items-center justify-center hover:opacity-90 transition-opacity active:scale-95 shadow-[0_20px_40px_rgba(0,74,198,0.08)]">
<span class="material-symbols-outlined text-[40px]" data-icon="add">add</span>
</button>
</div>
<div class="text-center w-full">
<span class="text-xs text-on-surface-variant font-label uppercase tracking-widest block mb-2">Miktarı Artır</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-slate-50/80 dark:bg-[#191c1d]/80 backdrop-blur-xl text-[#004ac6] dark:text-[#2563eb] text-[10px] font-medium tracking-[0.1em] uppercase font-['Inter'] fixed bottom-0 w-full z-50 border-t border-slate-200/20 dark:border-white/5 shadow-[0_-10px_30px_rgba(0,0,0,0.03)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 md:hidden">
<a class="flex flex-col items-center justify-center text-[#004ac6] dark:text-[#2563eb] font-bold hover:opacity-80 transition-opacity tap-highlight-none active:scale-90 transition-transform w-16 h-12" href="#">
<span class="material-symbols-outlined mb-1" data-icon="counter" style="font-variation-settings: 'FILL' 1;">counter_1</span>
<span>Sayaç</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 hover:opacity-80 transition-opacity tap-highlight-none active:scale-90 transition-transform w-16 h-12" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span>Geçmiş</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 hover:opacity-80 transition-opacity tap-highlight-none active:scale-90 transition-transform w-16 h-12" href="#">
<span class="material-symbols-outlined mb-1" data-icon="track_changes">track_changes</span>
<span>Hedefler</span>
</a>
</nav>
</body></html>
