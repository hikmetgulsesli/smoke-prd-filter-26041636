<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smoke Sayaç - Hata Durumu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#404754",
                        "surface-tint": "#0053db",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-fixed": "#dce2f3",
                        "inverse-surface": "#2e3132",
                        "outline-variant": "#c3c6d7",
                        "on-background": "#191c1d",
                        "primary-container": "#2563eb",
                        "on-primary-fixed": "#00174b",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#360f00",
                        "surface-variant": "#e1e3e4",
                        "surface-container": "#edeeef",
                        "tertiary": "#943700",
                        "inverse-primary": "#b4c5ff",
                        "secondary-container": "#dce2f3",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#004ac6",
                        "on-secondary-container": "#5e6572",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#bc4800",
                        "secondary-fixed-dim": "#c0c7d6",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#151c27",
                        "secondary": "#585f6c",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "background": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "inverse-on-surface": "#f0f1f2",
                        "primary-fixed": "#dbe1ff",
                        "surface-dim": "#d9dadb",
                        "on-surface": "#191c1d",
                        "tertiary-fixed-dim": "#ffb596"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- The Measured Void Background -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-surface to-surface-bright -z-10"></div>
<!-- Error Card / Artifact -->
<main class="relative w-full max-w-sm px-6">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(186,26,26,0.05)] border border-outline-variant/15 p-8 flex flex-col items-center text-center">
<!-- Error Icon (Floating) -->
<div class="mb-8 p-4 rounded-full bg-error-container/50 inline-flex items-center justify-center">
<span class="material-symbols-outlined text-error text-4xl" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<!-- Value / Error Display (The Hero) -->
<div class="mb-4 text-error font-display font-bold tracking-tight text-3xl">
                --
            </div>
<!-- Error Message (The Label) -->
<p class="font-label text-error text-sm tracking-[0.1em] uppercase mb-12">
                localStorage hatası oluştu.<br/>Veriler kaydedilemiyor.
            </p>
<!-- Actions (Control Deck) -->
<div class="flex flex-col gap-4 w-full mt-4">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-medium text-lg py-4 rounded-lg shadow-[0_10px_20px_rgba(0,74,198,0.05)] bg-gradient-to-br from-primary-container to-primary transition-transform active:scale-[0.98]">
                    Tekrar Dene
                </button>
<button class="w-full bg-transparent text-secondary font-headline text-sm py-3 flex items-center justify-center gap-2 hover:bg-surface-container-low rounded-lg transition-colors">
<span class="material-symbols-outlined text-[18px]">home</span>
                    Ana Ekran
                </button>
</div>
</div>
</main>
</body></html>
