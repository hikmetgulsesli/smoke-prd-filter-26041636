<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar JSON Translation -->
<nav class="docked full-width top-0 no-border transition-colors duration-300 flat no shadows bg-slate-50 dark:bg-[#191c1d] flex justify-between items-center w-full px-6 py-4 z-40 hidden md:flex">

        </div>

</button>
</div>

<!-- Top Asymmetric Reset Action -->
<div class="w-full flex justify-end">
<button aria-label="Sıfırla" class="text-secondary hover:text-on-surface-variant transition-colors flex items-center space-x-2 text-sm font-medium tracking-wide outline-none focus-visible:ring-2 focus-visible:ring-primary rounded p-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 300;">refresh</span>
<span class="uppercase tracking-wider text-xs">Sıfırla</span>
</button>
</div>

<div class="flex-grow flex flex-col items-center justify-center py-16">
<h2 class="text-xs sm:text-sm font-semibold tracking-[0.1em] text-secondary uppercase mb-4 text-center">Toplam</h2>
<div class="text-[72px] sm:text-[96px] font-bold leading-none tracking-[-0.04em] text-on-surface font-display selection:bg-transparent">
                    42
                </div>
</div>

<div class="w-full flex justify-center items-center gap-4 sm:gap-6 mt-8">
<!-- Azalt (Secondary) -->
<button aria-label="Miktarı Azalt" class="bg-secondary-container text-on-secondary-container h-14 w-14 sm:h-16 sm:w-16 rounded-full flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 outline-none focus-visible:ring-2 focus-visible:ring-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 300;">remove</span>
</button>

<button aria-label="Miktarı Artır" class="glass-gradient ambient-shadow text-on-primary h-20 w-20 sm:h-24 sm:w-24 rounded-full flex items-center justify-center hover:opacity-90 transition-all active:scale-95 outline-none focus-visible:ring-2 focus-visible:ring-offset-4 focus-visible:ring-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'wght' 300;">add</span>
</button>
</div>

<nav class="bg-slate-50/80 dark:bg-[#191c1d]/80 backdrop-blur-xl fixed bottom-0 w-full z-50 border-t border-slate-200/20 dark:border-white/5 shadow-[0_-10px_30px_rgba(0,0,0,0.03)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 md:hidden">

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">track_changes</span>

</a>
